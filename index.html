<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="רגע — התמצאות בזמן עברי ואזרחי: מה עכשיו, מה חשוב עכשיו ומה המעבר הבא" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <!-- אייפון מתעלם מ־SVG לאייקון מסך הבית וזקוק ל־PNG -->
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="רגע" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>רגע · זמן עברי ואזרחי</title>
    <!-- מסך הפתיחה מוטמע כאן (ולא ב־React) כדי שייראה מיד, עוד לפני טעינת האפליקציה -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #FBF3E4; color: #3E4B6B;
        font-family: 'Segoe UI', 'Heebo', 'Noto Sans Hebrew', system-ui, sans-serif;
        transition: opacity .45s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark { width: 132px; height: 132px; }
      #splash .name {
        font-size: 2.6rem; font-weight: 700; letter-spacing: .04em;
        color: #B4741C; margin-top: 18px; line-height: 1;
      }
      #splash .tag { font-size: .95rem; color: #7D7261; margin-top: 8px; }
      #splash .sig {
        position: absolute; bottom: calc(34px + env(safe-area-inset-bottom));
        display: flex; flex-direction: column; align-items: center; gap: 7px;
      }
      #splash .sig .rule { width: 34px; height: 1px; background: #C9BCA2; }
      #splash .sig .by {
        font-size: .62rem; letter-spacing: .34em; text-transform: uppercase;
        color: #A2947E; font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        #splash { background: #12161f; }
        #splash .name { color: #E0B45C; }
        #splash .tag { color: #99a1ae; }
        #splash .sig .by { color: #6D7482; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="120" y1="296" x2="392" y2="296" stroke="#C9A227" stroke-width="9" stroke-linecap="round" opacity="0.4"/>
        <path d="M140 296 A116 116 0 0 1 372 296" fill="none" stroke="#E0A33C" stroke-width="21" stroke-linecap="round"/>
        <circle cx="372" cy="296" r="31" fill="#D9822B"/>
        <path d="M232 356 a54 54 0 1 0 64 64 44 44 0 1 1-64-64z" fill="#3E4B6B"/>
        <circle cx="330" cy="376" r="10" fill="#3E4B6B"/>
        <circle cx="196" cy="418" r="6.5" fill="#3E4B6B" opacity="0.7"/>
      </svg>
      <div class="name">רגע</div>
      <div class="tag">זמן עברי ואזרחי</div>
      <div class="sig">
        <div class="rule"></div>
        <div class="by">Alush Tech</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
